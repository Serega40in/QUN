<div class="wrap">
  <div class="top"><span class="gem">◆</span> QUN BUILD TOGETHER</div>
  <h3>Что развиваем следующим?</h3>
  <p class="sub">Помоги выбрать направление сообщества.</p>
  <button onclick="vote('roadmap:messenger')"><b>01</b><span><strong>QUN Messenger</strong><small>Общение и звонки</small></span><i>↗</i></button>
  <button onclick="vote('roadmap:ai')"><b>02</b><span><strong>QUN AI Studio</strong><small>Творчество и инструменты ИИ</small></span><i>↗</i></button>
  <button onclick="vote('roadmap:market')"><b>03</b><span><strong>QUN Market</strong><small>Сервисы и полезные продукты</small></span><i>↗</i></button>
  <p id="status" class="hint">Твой выбор поможет расставить приоритеты.</p>
</div>
<style>
.wrap{font-family:system-ui,sans-serif;color:var(--tg-theme-text-color);padding:4px}
.top{font-size:11px;letter-spacing:1.2px;font-weight:800;color:var(--tg-theme-accent-text-color);margin-bottom:8px}
.gem{font-size:16px;margin-right:5px}
h3{font-size:19px;margin:0 0 5px;line-height:1.25}
.sub,.hint{font-size:13px;color:var(--tg-theme-hint-color);line-height:1.4}
button{display:flex;align-items:center;gap:10px;width:100%;margin:8px 0;padding:10px;border:1px solid var(--tg-theme-section-separator-color);border-radius:12px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);text-align:left}
button b{font-size:11px;color:var(--tg-theme-accent-text-color)}
button span{display:flex;flex:1;flex-direction:column;gap:3px}
button strong{font-size:14px}
button small{font-size:12px;color:var(--tg-theme-hint-color)}
button i{font-style:normal}
</style>
<script>
function vote(data){
 const s=document.getElementById('status');
 if(!window.TelegramWidget){s.textContent='Демо: выбран '+data.split(':')[1]+'.';return}
 s.textContent='Отправляем выбор…';
 TelegramWidget.request(data).then(a=>{s.textContent=a.result||'Спасибо! Выбор принят.'},e=>{s.textContent='Ошибка отправки: '+e.code});
}
if(window.TelegramWidget)TelegramWidget.ready();
</script>
