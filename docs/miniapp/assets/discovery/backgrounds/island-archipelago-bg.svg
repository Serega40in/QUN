 <linearGradient id="sun" x2="0" y2="1"><stop stop-color="#fff3bd"/><stop offset="1" stop-color="#f3bd68"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
