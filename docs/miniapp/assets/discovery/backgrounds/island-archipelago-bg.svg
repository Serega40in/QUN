<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">QUN Discovery — Island Archipelago</title><desc id="desc">An original, peaceful fantasy archipelago with emerald islands, turquoise water, a distant observatory, forest, and lighthouse.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#123b67"/><stop offset=".48" stop-color="#48a6bd"/><stop offset="1" stop-color="#f4d6a0"/></linearGradient>
