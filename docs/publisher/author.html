<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Профиль автора QUN News"><title>Автор — QUN News</title><style>body{margin:0;background:#071724;color:#edf5f5;font:15px/1.6 system-ui}header{padding:18px;border-bottom:1px solid #254251}main{max-width:900px;margin:28px auto;padding:0 15px}.panel{border:1px solid #254251;background:#0c2130;border-radius:15px;padding:22px;margin-bottom:15px}h1{margin:5px 0}.muted{color:#95aab4}.card{padding:16px;border:1px solid #254251;border-radius:12px;margin:10px 0}a{color:#4bd6a2}</style></head><body><header><a href="./" style="color:#edf5f5;text-decoration:none;font-weight:800">QUN NEWS</a></header><main><section class="panel" id="profile">Загружаем профиль…</section><h2>Публикации автора</h2><section id="articles" class="muted">Загружаем…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>const db=supabase.createClient('https://qdxjltqlnphvzafapncm.supabase.co','sb_publishable_aCUwbGYj_kUU8nVUu1kWmQ_-d-8fp8L');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const u=new URLSearchParams(location.search).get('u');if(!u)return;const {data:p}=await db.from('qun_publisher_profiles').select('*').eq('username',u).maybeSingle();if(!p){document.getElementById('profile').textContent='Автор не найден.';return}document.title=(p.display_name||p.username)+' — QUN News';document.querySelector('meta[name=description]').content=p.bio||'Публикации автора '+p.username;document.getElementById('profile').innerHTML='<div class="muted">ПРОФИЛЬ АВТОРА QUN NEWS</div><h1>'+esc(p.display_name||p.username)+'</h1><p class="muted">@'+esc(p.username)+'</p><p>'+esc(p.bio||'Автор QUN News')+'</p>'+(p.website_url?'<p><a rel="nofollow noopener" target="_blank" href="'+esc(p.website_url)+'">Сайт автора ↗</a></p>':'');const {data:rows}=await db.from('qun_articles').select('slug,title,description,published_at,cover_url').eq('author_id',p.id).eq('status','published').order('published_at',{ascending:false});document.getElementById('articles').innerHTML=(rows||[]).length?rows.map(a=>'<article class="card">'+(a.cover_url?'<img src="'+esc(a.cover_url)+'" style="width:100%;max-height:240px;object-fit:cover">':'')+'<h3><a href="article.html?slug='+encodeURIComponent(a.slug)+'">'+esc(a.title)+'</a></h3><p>'+esc(a.description)+'</p></article>').join(''):'Пока нет опубликованных статей.'}load();</script></body></html>
