<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbfbf8"><title>Публикация — QUN News</title>
<style>
:root{--paper:#fbfbf8;--ink:#202a25;--muted:#68746c;--line:#e6e9e2;--green:#147c63}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.8 Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}a{color:var(--green);text-decoration:none}.top{border-bottom:1px solid var(--line);font:13px/1.4 system-ui,sans-serif}.topin{max-width:780px;margin:auto;padding:19px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:.15em;color:var(--ink)}.wrap{width:min(720px,calc(100% - 36px));margin:auto}.back{display:inline-block;margin:32px 0 45px;font:13px system-ui,sans-serif}.meta{font:800 11px/1.4 system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--green)}h1{font:500 clamp(40px,8vw,64px)/1.03 Georgia,serif;letter-spacing:-.055em;margin:18px 0}.lead{font:22px/1.55 system-ui,sans-serif;color:var(--muted);margin:22px 0 30px}.art{height:280px;background:linear-gradient(145deg,#f0f6f2,#e5efea);display:grid;place-items:center;border-radius:5px;margin:28px 0 34px}.orb{width:180px;aspect-ratio:1;border-radius:40% 60% 56% 44%;background:radial-gradient(circle at 32% 28%,#fff,#d8eee6 22%,#8cc6b4 48%,#2d7180 73%,#193f5b);box-shadow:inset -17px -20px 35px #14394b40,0 22px 55px #2b78621c;transform:rotate(-12deg)}.body p{margin:0 0 23px}.cta{display:inline-block;margin:6px 0 12px;padding:12px 18px;border:1px solid #a5cabb;border-radius:999px;font:750 13px system-ui,sans-serif}.feedback{font:14px/1.6 system-ui,sans-serif;color:var(--muted);border-top:1px solid var(--line);margin-top:48px;padding:22px 0}.footer{font:12px system-ui,sans-serif;color:#828c84;border-top:1px solid var(--line);margin-top:50px;padding:24px 0 45px}@media(max-width:600px){.lead{font-size:19px}.art{height:220px}.orb{width:150px}}
</style></head><body><header class="top"><div class="topin"><a class="brand" href="./">QUN / NEWS</a><a href="./">Все публикации ↗</a></div></header><main class="wrap"><a class="back" href="./">← Все публикации</a><article id="article"><p>Загружаем материал…</p></article><footer class="footer">QUN News · Технологии ближе. Люди важнее.</footer></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=new URLSearchParams(location.search).get("id");
fetch("./posts.json").then(r=>r.json()).then(list=>{const a=list.find(x=>x.id===id&&x.status==="published");if(!a)throw Error("not-found");document.title=a.title+" — QUN News";$("#article").innerHTML=`<div class="meta">${esc(a.category)} · ${esc(a.date)}</div><h1>${esc(a.title)}</h1><p class="lead">${esc(a.lead)}</p><div class="art" aria-label="Абстрактная иллюстрация QUN"><div class="orb"></div></div><div class="body">${a.body.map(p=>"<p>"+esc(p)+"</p>").join("")}</div><a class="cta" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.cta||"Открыть QUN")} ↗</a><div class="feedback">Что думаете? <a href="${esc(a.feedback_url||"https://t.me/quncommunity")}" target="_blank" rel="noopener">Поделитесь отзывом в сообществе QUN ↗</a></div>`}).catch(()=>{$("#article").innerHTML="<h1>Материал не найден</h1><p>Возможно, ссылка устарела.</p><a href='./'>Вернуться к публикациям</a>"});
</script></body></html>
