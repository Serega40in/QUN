<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbfbf8">
<title>QUN News</title>
<meta name="description" content="Журнал QUN — новости экосистемы.">
<link rel="stylesheet" href="common.css">
<style>
.page{width:min(720px,calc(100% - 40px));margin:auto}
.back{display:inline-flex;gap:8px;margin:36px 0 34px;font-size:14px;color:var(--muted)}.back:hover{color:var(--green)}
.emo{font-size:40px;line-height:1;margin-bottom:18px;display:block}
h1{font:400 clamp(34px,6vw,56px)/1.06 var(--serif);letter-spacing:-.03em;margin:14px 0 18px}
.lead{font-size:clamp(18px,2.4vw,21px);line-height:1.55;color:var(--muted);margin:0}
.cover{margin:38px auto 44px;width:min(960px,calc(100% - 40px));border-radius:24px;overflow:hidden;background:#f3f5f1;box-shadow:var(--shadow)}
.cover img{width:100%;aspect-ratio:3/2;object-fit:cover}
.body{font-size:18px;line-height:1.75}
.body p{margin:0 0 22px}
.body h2{font:400 27px/1.2 var(--serif);letter-spacing:-.015em;margin:42px 0 16px}
.body strong{font-weight:650}
.body p a,.body li a,.body .note a{color:var(--green);text-decoration:underline;text-decoration-color:#9fd0bf;text-underline-offset:3px;text-decoration-thickness:1.5px}
.body p a:hover,.body li a:hover{text-decoration-color:var(--green)}
.body ul{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:10px}
.body li{padding:14px 18px;background:var(--white);border:1px solid var(--line);border-radius:14px;font-size:16.5px;line-height:1.55}
.note{display:flex;gap:12px;padding:16px 20px;margin:0 0 26px;background:var(--green-soft);border-radius:14px;font-size:15.5px;line-height:1.6;color:#24473b}
.note:before{content:"ⓘ";font-weight:700;color:var(--green)}
blockquote{margin:38px 0;padding:6px 0 6px 24px;border-left:2px solid var(--gold);font:italic 400 clamp(22px,3vw,27px)/1.4 var(--serif);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:40px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:650;font-size:15px;border:1px solid var(--line);background:var(--white);transition:transform .2s,box-shadow .2s,border-color .2s}
.btn:hover{transform:translateY(-1px);border-color:#bfd9cf}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 8px 20px -10px #137a62aa}
.share{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.share a{color:var(--green)}
.next{margin-top:64px}
.next h3{font:400 24px/1.2 var(--serif);margin:8px 0 18px}
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ncard{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;padding:12px;background:var(--white);border:1px solid var(--line);border-radius:16px;transition:box-shadow .2s}
.ncard:hover{box-shadow:var(--shadow)}
.ncard .art{border-radius:12px}
.ncard small{color:var(--muted);font-size:12px}
.ncard b{display:block;font:400 17px/1.25 var(--serif);margin-top:3px}
.missing{padding:120px 0;text-align:center;color:var(--muted)}
@media (max-width:600px){.body{font-size:17px}.ngrid{grid-template-columns:1fr}.cover{border-radius:18px;width:calc(100% - 32px)}.page{width:calc(100% - 32px)}}
</style>
</head>
<body>
<header class="top"><div class="topin">
 <a class="brand" href="./"><span class="mark">Q</span>QUN <small>/ NEWS</small></a>
 <nav class="nav"><a class="hide-sm" href="./">Все публикации</a><a class="pill" href="https://t.me/qunnews" target="_blank" rel="noopener">Telegram ↗</a></nav>
</div></header>
<main id="root"><p class="missing">Загружаем материал…</p></main>
<footer class="foot"><div class="footin"><span>QUN News · Технологии ближе. Люди важнее.</span><nav><a href="./">Журнал</a><a href="https://quniverse.ru/">Экосистема QUN</a><a href="https://t.me/quncommunity" target="_blank" rel="noopener">Сообщество</a></nav></div></footer>
<script src="common.js"></script>
<script>
const {esc,inline,prettyDate,visible,load,readMin}=QN;
const id=new URLSearchParams(location.search).get("id");
const block=b=>{switch(b.t){
 case "h":return `<h2>${inline(b.x)}</h2>`;
 case "ul":return `<ul>${b.x.map(i=>`<li>${inline(i)}</li>`).join("")}</ul>`;
 case "note":return `<div class="note"><span>${inline(b.x)}</span></div>`;
 case "quote":return `<blockquote>${inline(b.x)}</blockquote>`;
 default:return `<p>${inline(b.x)}</p>`}};
const setMeta=(n,v,p)=>{let m=document.querySelector(`meta[${p?"property":"name"}="${n}"]`);if(!m){m=document.createElement("meta");m.setAttribute(p?"property":"name",n);document.head.appendChild(m)}m.content=v};
load().then(d=>{
 const list=visible(d);const i=list.findIndex(a=>a.id===id);const a=list[i];
 if(!a){document.getElementById("root").innerHTML='<div class="page missing"><p>Материал пока не опубликован или не найден.</p><p><a class="btn" href="./">← Все публикации</a></p></div>';return}
 document.title=`${a.title} — QUN News`;setMeta("description",a.lead);setMeta("og:title",a.title,1);setMeta("og:description",a.lead,1);setMeta("og:image",new URL(a.image,location.href).href,1);
 const others=[list[i+1],list[i-1]].filter(Boolean).slice(0,2);
 document.getElementById("root").innerHTML=`
 <div class="page"><a class="back" href="./">← Все публикации</a>
  <span class="emo" aria-hidden="true">${esc(a.emoji||"✨")}</span>
  <div class="meta"><span class="cat">${esc(a.category||"QUN")}</span><span class="dot">·</span><span>${esc(prettyDate(a.date))}</span><span class="dot">·</span><span>${readMin(a)} мин чтения</span></div>
  <h1>${esc(a.title)}</h1><p class="lead">${inline(a.lead)}</p></div>
 <figure class="cover"><img src="${esc(a.image)}" alt="${esc(a.title)}"></figure>
 <article class="page body">${(a.blocks||[]).map(block).join("")}
  <div class="actions">${a.url?`<a class="btn primary" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.cta||"Открыть")} ↗</a>`:""}<a class="btn" href="${esc(a.feedback_url||"https://t.me/quncommunity")}" target="_blank" rel="noopener">💬 Оставить отзыв</a></div>
  <div class="share"><span>Понравилось? Поделитесь с теми, кому это может быть близко.</span><a href="${esc(a.telegram_url||"https://t.me/qunnews")}" target="_blank" rel="noopener">Читать в Telegram ↗</a></div>
  ${others.length?`<section class="next"><div class="kicker">Ещё в журнале</div><h3>Читайте также</h3><div class="ngrid">${others.map(o=>`<a class="ncard" href="article.html?id=${encodeURIComponent(o.id)}"><div class="art"><img src="${esc(o.image)}" alt="" loading="lazy"></div><div><small>${esc(prettyDate(o.date))}</small><b>${esc(o.emoji||"")} ${esc(o.title)}</b></div></a>`).join("")}</div></section>`:""}
 </article>`;
}).catch(()=>{document.getElementById("root").innerHTML='<p class="missing">Не удалось загрузить материал. Обновите страницу чуть позже.</p>'});
</script>
</body>
</html>
