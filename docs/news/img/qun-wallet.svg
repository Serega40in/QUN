<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">QUN Wallet — тестовый цифровой кошелёк</title>
<desc id="desc">Прозрачный стеклянный кошелёк с тремя сияющими кристаллами синего, изумрудного и золотого цвета на белом фоне.</desc>
