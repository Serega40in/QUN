<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#17241f"><title>QUN Architecture — Modular House 01</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17241f;color:#f4f1e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hero{position:absolute;top:20px;left:22px;right:22px;pointer-events:none;display:flex;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:.24em;color:#d7bd84;text-transform:uppercase}h1{font-size:clamp(28px,4vw,44px);line-height:.96;letter-spacing:-.05em;font-weight:500;margin:10px 0}.sub{font-size:12px;max-width:330px;color:#e1e8e0;line-height:1.5}.pill{border:1px solid #ffffff40;background:#17241fbd;border-radius:30px;padding:10px;font-size:10px;height:max-content}.panel{position:absolute;left:16px;bottom:16px;width:min(350px,calc(100% - 32px));padding:14px;border:1px solid #ffffff25;border-radius:16px;background:#13211ee8;backdrop-filter:blur(16px)}.label{font-size:10px;letter-spacing:.2em;color:#d7bd84;margin-bottom:10px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{padding:11px 7px;border:1px solid #ffffff25;border-radius:9px;background:#ffffff0b;color:#f4f1e8;font-size:12px}button.active{background:#8eb39c38;border-color:#b9d5bd}.foot{position:absolute;right:20px;bottom:22px;text-align:right;font-size:11px;line-height:1.6;color:white;text-shadow:0 2px 8px #000;max-width:180px}@media(max-width:600px){.hero{top:14px;left:14px;right:14px}.pill{font-size:8px;padding:8px}.sub{max-width:250px;font-size:11px}.panel{left:10px;bottom:10px;width:calc(100% - 20px);padding:11px}.foot{right:12px;bottom:205px;max-width:125px;font-size:10px}}
</style></head><body><canvas id="c"></canvas>
<div class="hero"><div><div class="eyebrow">QUN Architecture · collection 01</div><h1>Дом как<br>архитектурная идея.</h1><div class="sub">Модульная резиденция: выразительный двухэтажный объём, низкие крылья, тёмные графичные рамы и тёплая древесина.</div></div><div class="pill">CONCEPT STUDY / 01</div></div>
<div class="panel"><div class="label">ИССЛЕДОВАТЬ МОДЕЛЬ</div><div class="buttons"><button id="day" class="active">☼ Дневной свет</button><button id="night">✦ Сумерки</button><button id="explode">Раздвинуть модули</button><button id="roof">Снять кровлю</button><button id="labels">Подписи зон</button><button id="reset">Общий ракурс</button></div></div>
<div class="foot">Проведите пальцем или мышью, чтобы вращать.<br>Колесо или щипок — масштаб.</div>
<script>
(()=>{const c=document.querySelector('#c'),g=c.getContext('2d');let W,H,dpr=1,a=-.62,t=.36,z=1,night=false,split=false,noroof=false,labels=false,drag=null;
function size(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);draw()}
function p(x,y,q){let X=x*Math.cos(a)-q*Math.sin(a),Z=x*Math.sin(a)+q*Math.cos(a),Y=y*Math.cos(t)-Z*Math.sin(t);let k=Math.min(W/17,H/10.5)*z;return{x:W*.52+X*k,y:H*.54+Y*k,k}}
function poly(v,col,stroke){let ps=v.map(v=>p(...v));g.beginPath();ps.forEach((v,i)=>i?g.lineTo(v.x,v.y):g.moveTo(v.x,v.y));g.closePath();g.fillStyle=col;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}}
function ln(v,w,col,lw=1){let A=p(...v),B=p(...w);g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.strokeStyle=col;g.lineWidth=lw;g.stroke()}
function block(x,q,w,d,y,h,roof=true,windows=[]){let x1=x-w/2,x2=x+w/2,q1=q-d/2,q2=q+d/2;const wood=night?'#46382f':'#684a39',side=night?'#302f2b':'#45372e',top=night?'#333a39':'#454b49',glass=night?'#425d5a':'#9ebbb2';poly([[x1,y,q1],[x2,y,q1],[x2,y,q2],[x1,y,q2]],'#817c6d');poly([[x1,y,q1],[x2,y,q1],[x2,h,q1],[x1,h,q1]],wood);poly([[x2,y,q1],[x2,y,q2],[x2,h,q2],[x2,h,q1]],side);poly([[x1,y,q2],[x2,y,q2],[x2,h,q2],[x1,h,q2]],wood);
for(let yy=y+.17;yy<h;yy+=.18){ln([x1,yy,q1-.01],[x2,yy,q1-.01],night?'#765747':'#99765d',.7);ln([x2+.01,yy,q1],[x2+.01,yy,q2],night?'#60483a':'#795b47',.7)}
windows.forEach(v=>{let [dx,dy,ww,hh]=v,xa=x+dx-ww/2,xb=x+dx+ww/2,ya=y+dy,yb=ya+hh;poly([[xa,ya,q1-.035],[xb,ya,q1-.035],[xb,yb,q1-.035],[xa,yb,q1-.035]],glass,'#242c2a');ln([xa,ya,q1-.05],[xb,ya,q1-.05],'#202a28',2);ln([xa,yb,q1-.05],[xb,yb,q1-.05],'#202a28',2);ln([xa,ya,q1-.05],[xa,yb,q1-.05],'#202a28',2);ln([xb,ya,q1-.05],[xb,yb,q1-.05],'#202a28',2);if(ww>1)ln([x+dx,ya,q1-.06],[x+dx,yb,q1-.06],'#202a28',2)});
if(roof&&!noroof){let lift=split?.65:0;poly([[x1-.2,h+.14+lift,q1-.2],[x2+.2,h+.14+lift,q1-.2],[x2+.2,h+.14+lift,q2+.2],[x1-.2,h+.14+lift,q2+.2]],top,'#858b80');poly([[x1-.2,h+.14+lift,q1-.2],[x2+.2,h+.14+lift,q1-.2],[x2+.2,h+.3+lift,q1-.2],[x1-.2,h+.3+lift,q1-.2]],'#252d2b')}
}
function draw(){g.clearRect(0,0,W,H);let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,night?'#152333':'#9aafa9');sky.addColorStop(.52,night?'#465556':'#d5d5c9');sky.addColorStop(1,night?'#172922':'#6b805f');g.fillStyle=sky;g.fillRect(0,0,W,H);poly([[-100,0,-100],[100,0,-100],[100,0,100],[-100,0,100]],night?'#293c31':'#7d8d6d');
for(let i=0;i<22;i++){let v=i*2.399,r=9+(i%4),x=Math.cos(v)*r,q=Math.sin(v)*r,A=p(x,0,q),B=p(x,2.2,q);g.fillStyle=night?'#234233':'#3e6245';g.beginPath();g.moveTo(A.x,A.y);g.lineTo(A.x-(A.y-B.y)*.32,B.y);g.lineTo(A.x+(A.y-B.y)*.32,B.y);g.closePath();g.fill();g.fillStyle=night?'#2d4b3a':'#54744e';g.beginPath();g.moveTo(A.x,A.y-8);g.lineTo(A.x-(A.y-B.y)*.23,B.y+7);g.lineTo(A.x+(A.y-B.y)*.23,B.y+7);g.closePath();g.fill()}
let s=split?1:0;block(-1.6-s*.8,-.3,6.1,4.5,.12,5.1,true,[[-1.6,1,1.7,1.45],[.35,1.1,.8,.85],[1.7,1.1,1.05,1.7],[-1.5,3.0,1.25,1.2],[.35,2.9,.9,1.5],[1.7,3.1,.75,.7]]);block(4.2+s,1.65,5.7,4.1,.12,2.45,true,[[-1.65,.6,1.5,1.25],[.3,.65,1.05,1],[1.7,.65,1.15,1.2]]);block(-3.5-s,2.2,2.5,2.7,.12,2.45,true,[[-.45,.6,.65,1.1],[.5,.6,.65,1.1]]);
poly([[-6,.14,3.2],[7.2,.14,3.2],[7.2,.14,5.8],[-6,.14,5.8]],night?'#50483b':'#a18461','#584b3b');for(let i=0;i<23;i++){let x=-5.8+i*.58;ln([x,.16,3.25],[x,.16,5.75],night?'#302d27':'#71563e',.7)}
for(let i=0;i<4;i++){let q=6.05+i*.34;poly([[-4.7,.12-i*.025,q],[5.2,.12-i*.025,q],[5.2,.12-i*.025,q+.3],[-4.7,.12-i*.025,q+.3]],night?'#5b5b50':'#b9b4a6')}
if(night){let q=p(0,2.5,0),gr=g.createRadialGradient(q.x,q.y,2,q.x,q.y,180);gr.addColorStop(0,'#e5bd78aa');gr.addColorStop(1,'#e5bd7800');g.fillStyle=gr;g.fillRect(q.x-180,q.y-180,360,360)}
if(labels){[['01 · ДВА УРОВНЯ',-1.5,5.9,-.2],['02 · ЖИЛОЕ КРЫЛО',4.3,3,1.6],['03 · ТЕРРАСА',.2,.6,4.5]].forEach(v=>{let q=p(v[1],v[2],v[3]);g.font='600 10px system-ui';let w=g.measureText(v[0]).width+18;g.fillStyle='#13221fea';g.beginPath();g.roundRect(q.x-w/2,q.y-13,w,26,7);g.fill();g.strokeStyle='#d0b47b';g.stroke();g.fillStyle='#f5ead6';g.textAlign='center';g.fillText(v[0],q.x,q.y+4)})}}
function btn(id,fn){document.getElementById(id).onclick=e=>{fn();e.currentTarget.classList.toggle('active');draw()}}
document.getElementById('day').onclick=()=>{night=false;document.getElementById('day').classList.add('active');document.getElementById('night').classList.remove('active');draw()};document.getElementById('night').onclick=()=>{night=true;document.getElementById('night').classList.add('active');document.getElementById('day').classList.remove('active');draw()};btn('explode',()=>split=!split);btn('roof',()=>noroof=!noroof);btn('labels',()=>labels=!labels);document.getElementById('reset').onclick=()=>{a=-.62;t=.36;z=1;night=split=noroof=labels=false;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('day').classList.add('active');draw()};
c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,a,t};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;a=drag.a+(e.clientX-drag.x)*.009;t=Math.max(.12,Math.min(.75,drag.t+(e.clientY-drag.y)*.003));draw()});c.addEventListener('pointerup',()=>drag=null);c.addEventListener('pointercancel',()=>drag=null);c.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(.55,Math.min(1.8,z*(e.deltaY>0?.93:1.07)));draw()},{passive:false});let pinch=null;c.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});c.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){let n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);z=Math.max(.55,Math.min(1.8,z*n/pinch));pinch=n;draw()}},{passive:true});addEventListener('resize',size);size()})();
</script></body></html>
