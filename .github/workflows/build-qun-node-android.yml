name: Build QUN Node Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "node-android/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-qun-node-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Build installable debug APK
        run: gradle :node-android:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUN-Node-Android
          path: node-android/build/outputs/apk/debug/node-android-debug.apk
          if-no-files-found: error
          retention-days: 30
