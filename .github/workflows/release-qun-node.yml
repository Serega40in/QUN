name: Release QUN Node with automatic updates

on:
  push:
    tags:
      - "qun-node-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/qun-node/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require update-manifest signing key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ELECTRON_BUILDER_UPDATE_SIGN_KEY)) {
            throw "Add repository secret QUN_UPDATE_SIGN_PRIVATE_KEY before creating a release."
          }
        env:
          ELECTRON_BUILDER_UPDATE_SIGN_KEY: ${{ secrets.QUN_UPDATE_SIGN_PRIVATE_KEY }}
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer, portable app and signed update manifest
        run: npm run dist:win -- --publish never
        env:
          ELECTRON_BUILDER_UPDATE_SIGN_KEY: ${{ secrets.QUN_UPDATE_SIGN_PRIVATE_KEY }}
      - name: Copy release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/release" | Out-Null
          Copy-Item "dist/*" "$env:RUNNER_TEMP/release/" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: QUN-Node-Windows-Release
          path: ${{ runner.temp }}/release/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Require stable Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.QUN_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.QUN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QUN_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing QUN_ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing QUN_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing QUN_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing QUN_ANDROID_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/qun-node-release.jks"
          echo "QUN_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/qun-node-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android APK
        run: gradle :node-android:assembleRelease
        env:
          QUN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QUN_ANDROID_KEYSTORE_PASSWORD }}
          QUN_ANDROID_KEY_ALIAS: ${{ secrets.QUN_ANDROID_KEY_ALIAS }}
          QUN_ANDROID_KEY_PASSWORD: ${{ secrets.QUN_ANDROID_KEY_PASSWORD }}
      - name: Rename APK for release updater
        run: cp node-android/build/outputs/apk/release/node-android-release.apk "$RUNNER_TEMP/QUN-Node-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: QUN-Node-Android-Release
          path: ${{ runner.temp }}/QUN-Node-Android.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QUN Node ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
