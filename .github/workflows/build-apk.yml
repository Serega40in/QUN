name: Build QUN Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/downloads/**"
      - "docs/update.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Prepare persistent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.QUN_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.QUN_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing QUN_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing QUN_KEYSTORE_PASSWORD"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/qun-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/qun-release.jks" -storepass "$STORE_PASSWORD" >/dev/null
      - name: Normalize generated Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/qun/messenger/MainActivity.kt")
          s = p.read_text()
          if "import kotlinx.serialization.json.jsonObject" not in s:
              s = s.replace("import kotlinx.serialization.json.Json\n", "import kotlinx.serialization.json.Json\nimport kotlinx.serialization.json.jsonObject\n")
          s = re.sub(r'\\n    suspend fun adminMessages\\(code: String, name: String\\): List<AdminMessage> \\{.*?\\n    suspend fun adminSend\\(code: String, name: String, body: String\\) \\{.*?\\n    \\}', '\\n', s, flags=re.S)
          p.write_text(s)
          PY
      - name: Build signed release APK
        env:
          QUN_KEYSTORE_PATH: ${{ runner.temp }}/qun-release.jks
          QUN_KEYSTORE_PASSWORD: ${{ secrets.QUN_KEYSTORE_PASSWORD }}
          QUN_KEY_ALIAS: ${{ secrets.QUN_KEY_ALIAS }}
          QUN_KEY_PASSWORD: ${{ secrets.QUN_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: QUN-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish signed update
        run: |
          mkdir -p docs/downloads
          cp app/build/outputs/apk/release/app-release.apk docs/downloads/QUN-latest.apk
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | sed -E "s/.*\"([^\"]+)\".*/\1/")
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | sed -E "s/[^0-9]*([0-9]+).*/\1/")
          cat > docs/update.json <<EOF
          {"versionCode":$VERSION_CODE,"versionName":"$VERSION_NAME","apkUrl":"https://raw.githubusercontent.com/Serega40in/QUN/main/docs/downloads/QUN-latest.apk","notes":"QUN $VERSION_NAME — стабильное release-обновление."}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p docs/downloads
            cp app/build/outputs/apk/release/app-release.apk docs/downloads/QUN-latest.apk
            cat > docs/update.json <<EOF
          {"versionCode":$VERSION_CODE,"versionName":"$VERSION_NAME","apkUrl":"https://raw.githubusercontent.com/Serega40in/QUN/main/docs/downloads/QUN-latest.apk","notes":"QUN $VERSION_NAME — стабильное release-обновление."}
          EOF
            git add docs/downloads/QUN-latest.apk docs/update.json
            git commit -m "chore: publish signed QUN update $VERSION_NAME"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "Could not publish update after 3 attempts"
          exit 1
