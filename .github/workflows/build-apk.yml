name: Build QUN Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/downloads/**"
      - "docs/update.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Publish update files
        run: |
          mkdir -p docs/downloads
          cp app/build/outputs/apk/debug/app-debug.apk docs/downloads/QUN-latest.apk
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | sed -E 's/.*\"([^\"]+)\".*/\1/')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          cat > docs/update.json <<EOF
          {"versionCode":$VERSION_CODE,"versionName":"$VERSION_NAME","apkUrl":"https://raw.githubusercontent.com/Serega40in/QUN/main/docs/downloads/QUN-latest.apk","notes":"Новая версия QUN: улучшения, исправления и новые возможности."}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/QUN-latest.apk docs/update.json
          git diff --cached --quiet || (git commit -m "chore: publish QUN update $VERSION_NAME" && git push)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
