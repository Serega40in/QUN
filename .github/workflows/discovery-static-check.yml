name: Discovery static checks

on:
  pull_request:
    paths:
      - "docs/miniapp/**"
      - "docs/ai-orchestration/tests/**"
      - ".github/workflows/discovery-static-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/miniapp/**"
      - "docs/ai-orchestration/tests/**"
      - ".github/workflows/discovery-static-check.yml"

permissions:
  contents: read

jobs:
  discovery-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game JavaScript and local asset references
        run: node --test docs/ai-orchestration/tests/discovery-static.test.mjs
      - name: Validate SVG XML and manifest
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("docs/miniapp/assets/discovery")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert len(manifest["assets"]) == 6, "expected six art assets"
          for asset in manifest["assets"]:
              path = root / asset["path"]
              assert path.is_file(), f"missing asset: {path}"
              svg = ET.parse(path).getroot()
              assert svg.tag.endswith("svg"), f"not SVG: {path}"
              assert svg.attrib.get("width") == str(asset["width"]), f"width mismatch: {path}"
              assert svg.attrib.get("height") == str(asset["height"]), f"height mismatch: {path}"
              assert any(node.tag.endswith("title") for node in svg), f"missing title: {path}"
              assert any(node.tag.endswith("desc") for node in svg), f"missing description: {path}"
              print(f"OK {path}: {asset['width']}x{asset['height']}")
          PY
