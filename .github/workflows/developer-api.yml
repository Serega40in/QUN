name: QUN Developer API
on:
  pull_request:
    paths:
      - "developer-api/**"
      - ".github/workflows/developer-api.yml"
  push:
    branches: [main]
    paths:
      - "developer-api/**"
      - ".github/workflows/developer-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: developer-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
