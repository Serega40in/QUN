name: Discovery browser smoke test

on:
  pull_request:
    paths:
      - "docs/miniapp/**"
      - "docs/ai-orchestration/tests/**"
      - ".github/workflows/discovery-browser-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/miniapp/**"
      - "docs/ai-orchestration/tests/**"
      - ".github/workflows/discovery-browser-check.yml"

permissions:
  contents: read

jobs:
  discovery-browser:
    # Pin a supported runner image; ubuntu-latest moved to Ubuntu 26.04,
    # which Playwright 1.56 does not yet support for browser installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright
        run: |
          npm install --prefix /tmp/qun-playwright playwright@1.56.1
          /tmp/qun-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --directory docs >/tmp/qun-discovery-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/miniapp/discovery.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qun-discovery-http.log
          exit 1
      - name: Exercise real browser gameplay
        env:
          NODE_PATH: /tmp/qun-playwright/node_modules
        run: node --test docs/ai-orchestration/tests/discovery-browser.test.cjs
