name: Legacy QUN Pages deploy (disabled to prevent overwriting docs site)
on:
  workflow_dispatch:
permissions:
  contents: read
# The canonical GitHub Pages deployment is .github/workflows/deploy-web.yml.
# That workflow publishes docs/ and is triggered by changes under docs/**.
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical deployment
        run: echo "Use deploy-web.yml; this legacy workflow must not deploy repository root over docs/."
