name: Deploy QUN Web
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "apps/qun-mobile/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Include QUN Mobile app in published site
        run: |
          mkdir -p docs/apps
          rm -rf docs/apps/qun-mobile
          cp -R apps/qun-mobile docs/apps/qun-mobile
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
