name: Build QUN Node for Windows

on:
  push:
    branches: [ main ]
    paths:
      - "services/qun-node/**"
      - ".github/workflows/build-qun-node-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/qun-node/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm install
      - name: Build Windows installer and portable EXE
        run: npm run dist:win
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: QUN-Node-Windows-${{ github.sha }}
          path: services/qun-node/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
