name: QUN Studio Render Checks

on:
  push:
    branches: [main]
    paths:
      - "docs/studio/**"
      - ".github/workflows/qun-studio-render-checks.yml"
  pull_request:
    paths:
      - "docs/studio/**"
      - ".github/workflows/qun-studio-render-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile worker and helper modules
        run: python -m compileall -q docs/studio
      - name: Run render helper safety tests
        working-directory: docs/studio
        run: python -m unittest -v test_render_helpers.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Director JavaScript syntax
        run: node --input-type=module --check < docs/studio/director-automation.js
      - name: Check QUN GPU Art inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/studio/gpu-art.html").read_text(encoding="utf-8")
          match = re.search(r"<script>([\\s\\S]*?)</script>", html)
          if not match:
              raise SystemExit("QUN GPU Art script block not found")
          Path("/tmp/qun-gpu-art.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/qun-gpu-art.js
