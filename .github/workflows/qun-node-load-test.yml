name: QUN Node Local Load Test
on:
  push:
    paths:
      - "services/qun-node/**"
      - ".github/workflows/qun-node-load-test.yml"
  pull_request:
    paths:
      - "services/qun-node/**"
      - ".github/workflows/qun-node-load-test.yml"
  workflow_dispatch:
    inputs:
      clients:
        description: "Число виртуальных клиентов (локальный CI-узел)"
        required: true
        type: choice
        options:
          - "100"
          - "250"
          - "500"
          - "1000"
        default: "100"
      concurrency:
        description: "Одновременные запросчики (не более 50)"
        required: true
        type: choice
        options:
          - "5"
          - "10"
          - "20"
          - "50"
        default: "10"
      rounds:
        description: "Число раундов (1–5)"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
        default: "1"

jobs:
  node-tests-and-local-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit and replication tests
        working-directory: services/qun-node
        run: npm test
      - name: Start isolated local test node
        working-directory: services/qun-node
        run: |
          mkdir -p "${RUNNER_TEMP}/qun-node-data"
          QUN_NODE_HOST=127.0.0.1 QUN_NODE_PORT=8787 QUN_NODE_DATA_DIR="${RUNNER_TEMP}/qun-node-data" npm start > "${RUNNER_TEMP}/qun-node.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/qun-node.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/qun-node.log"
          exit 1
      - name: Synthetic local load test
        working-directory: services/qun-node
        env:
          QUN_LOAD_CLIENTS: ${{ github.event.inputs.clients || '100' }}
          QUN_LOAD_CONCURRENCY: ${{ github.event.inputs.concurrency || '10' }}
          QUN_LOAD_ROUNDS: ${{ github.event.inputs.rounds || '1' }}
        run: npm run test:load
      - name: Upload node log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qun-node-failure-log
          path: ${{ runner.temp }}/qun-node.log
          if-no-files-found: ignore
