name: QUN Node 0.1 tests

on:
  push:
    paths:
      - "services/qun-node/**"
      - ".github/workflows/qun-node-test.yml"
  pull_request:
    paths:
      - "services/qun-node/**"
      - ".github/workflows/qun-node-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Android Termux installer syntax
        run: bash -n services/qun-node/scripts/install-android-termux.sh
      - name: Check desktop entry syntax
        run: node --check services/qun-node/desktop/main.cjs
      - name: Run QUN Node tests
        working-directory: services/qun-node
        run: npm test
