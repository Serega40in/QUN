name: QUN Compute Provider Tests
on:
  push:
    paths:
      - "tools/qun-node-worker/providers/**"
      - ".github/workflows/test-qun-compute-provider.yml"
  pull_request:
    paths:
      - "tools/qun-node-worker/providers/**"
      - ".github/workflows/test-qun-compute-provider.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provider unit tests
        working-directory: tools/qun-node-worker/providers
        run: python -m unittest -v
