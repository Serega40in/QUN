const pages={
home:{title:"Обзор платформы",group:"Начало",keywords:"главная документация разработчик qun api wallet node",html:`
<div class="hero"><div class="eyebrow">QUN DEVELOPER PLATFORM · EARLY ACCESS</div><h1>Build on <span class="gradient">QUN.</span></h1><p class="lead">Инструменты, API и инфраструктура для создания приложений в экосистеме QUN — от первой интеграции до распределённой сети.</p><div class="actions"><button class="btn" data-go="quickstart">Начать разработку ↗</button><button class="btn secondary" data-go="architecture">Изучить архитектуру</button></div></div>
<div class="sectionhead"><h2>С чего начать</h2><p>Выбери направление</p></div><div class="grid">
<button class="card" data-go="quickstart"><div class="cardtop"><span class="cardicon">⚡</span><h3>Быстрый старт</h3></div><p>Пойми структуру платформы и подготовь первый проект.</p><span class="tag">5 минут · Guide ↗</span></button>
<button class="card" data-go="sdk"><div class="cardtop"><span class="cardicon">⌘</span><h3>SDK и API</h3></div><p>Принципы интеграции, версии API и работа с ошибками.</p><span class="tag">Reference ↗</span></button>
<button class="card" data-go="payments"><div class="cardtop"><span class="cardicon">↗</span><h3>Подключить платежи</h3></div><p>Безопасная обработка заказов и подтверждение транзакций.</p><span class="tag">Payments ↗</span></button>
<button class="card" data-go="node"><div class="cardtop"><span class="cardicon">▦</span><h3>Запустить QUN Node</h3></div><p>Узлы, объекты, контроль целостности и распределённое хранение.</p><span class="tag">Infrastructure ↗</span></button></div>
<div class="sectionhead"><h2>Платформа по слоям</h2><p>Единая система · модульная архитектура</p></div><div class="grid">
<button class="card" data-go="id"><div class="cardtop"><span class="cardicon">◎</span><h3>Identity</h3></div><p>QUN ID, профили и разрешения.</p></button>
<button class="card" data-go="connect"><div class="cardtop"><span class="cardicon">⌁</span><h3>Wallet & Connect</h3></div><p>Адаптеры кошельков и подтверждение действий.</p></button>
<button class="card" data-go="storage"><div class="cardtop"><span class="cardicon">▤</span><h3>Storage & Network</h3></div><p>Узлы, реплики и восстановление данных.</p></button>
<button class="card" data-go="core"><div class="cardtop"><span class="cardicon">⬡</span><h3>QUN Core</h3></div><p>Исследовательское направление собственной сети.</p></button></div>
<div class="notice"><strong>Статус проекта.</strong> Это первая версия документационного портала. Страницы описывают архитектурное направление и планируемые интеграции; функции, помеченные как roadmap, ещё не считаются реализованными или готовыми к production.</div>`},
quickstart:{title:"Быстрый старт",group:"Начало",keywords:"установка первый проект github pages supabase",html:`<div class="eyebrow">GET STARTED</div><h1>Быстрый старт</h1><p class="lead">Начни с работающего продукта, а затем подключай новые возможности QUN через стабильные интерфейсы.</p><div class="steps"><div class="step"><div class="num">1</div><div><strong>Изучи репозиторий QUN</strong><span>Проверь текущую структуру, README и актуальные инструкции перед изменениями.</span></div></div><div class="step"><div class="num">2</div><div><strong>Выбери продукт для интеграции</strong><span>Для веб-приложения начни с QUN ID или API. Для распределённой инфраструктуры — с QUN Node.</span></div></div><div class="step"><div class="num">3</div><div><strong>Создай отдельную ветку</strong><span>Проверяй изменения отдельно и не переписывай главную страницу QUN ради нового сервиса.</span></div></div><div class="step"><div class="num">4</div><div><strong>Добавь интеграцию и тесты</strong><span>Храни серверные секреты только в серверном окружении. Не публикуй приватные ключи в коде или браузере.</span></div></div><div class="step"><div class="num">5</div><div><strong>Проверь публикацию</strong><span>Убедись, что страницы работают на мобильных устройствах, ссылки корректны, а ошибки отображаются понятно.</span></div></div></div><h2>Текущий технологический фундамент</h2><ul><li><b>GitHub Pages</b> — статические сайты и документация.</li><li><b>Supabase</b> — база данных, авторизация и Edge Functions для серверной логики.</li><li><b>QUN Node</b> — отдельный развиваемый компонент для экспериментов с распределённым хранением.</li></ul><div class="notice"><strong>Важно:</strong> готовый универсальный публичный QUN SDK и production API ещё не объявлены. Примеры ниже иллюстрируют целевой стиль интеграции, а не существующий npm-пакет.</div><div class="actions"><button class="btn" data-go="architecture">Архитектура платформы →</button><button class="btn secondary" data-go="security">Безопасность</button></div>`},
architecture:{title:"Архитектура QUN",group:"Начало",keywords:"архитектура приложения сервисы экосистема",html:`<div class="eyebrow">SYSTEM OVERVIEW</div><h1>Архитектура QUN</h1><p class="lead">Модульная экосистема: приложения используют общие идентификацию, API и инструменты, но сохраняют независимость своих компонентов.</p><h2>Логические уровни</h2><div class="grid"><div class="card"><div class="cardtop"><span class="cardicon">◫</span><h3>Продукты</h3></div><p>QUN Messenger, Market, Publisher, AI, Wallet и другие интерфейсы.</p></div><div class="card"><div class="cardtop"><span class="cardicon">◎</span><h3>Общие сервисы</h3></div><p>QUN ID, профили, разрешения, поиск, уведомления и интеграционные API.</p></div><div class="card"><div class="cardtop"><span class="cardicon">▤</span><h3>Данные и вычисления</h3></div><p>Supabase на текущем этапе; постепенное развитие QUN Node и распределённых компонентов.</p></div><div class="card"><div class="cardtop"><span class="cardicon">⬡</span><h3>Протокол</h3></div><p>QUN Core и возможный блокчейн — отдельное исследовательское направление.</p></div></div><h2>Принципы</h2><ul><li>Не ломать существующие продукты при добавлении новых.</li><li>Версионировать публичные API и сохранять обратную совместимость.</li><li>Отделять клиентские интерфейсы от секретов и серверной бизнес-логики.</li><li>Не вводить блокчейн там, где достаточно обычной базы данных.</li><li>Проектировать распределённое хранение с учётом репликации и восстановления.</li></ul>`},
id:{title:"QUN ID",group:"Разработка",keywords:"авторизация профиль идентификатор единый аккаунт",html:`<div class="eyebrow">IDENTITY</div><h1>QUN ID</h1><p class="lead">Единый профиль пользователя для сервисов QUN. Цель — общая идентичность без повторной регистрации в каждом приложении.</p><h2>Целевая модель</h2><ul><li>Уникальный внутренний идентификатор пользователя.</li><li>Публичный профиль и настраиваемые поля.</li><li>Сессии, восстановление доступа и безопасный выход.</li><li>Разрешения приложений и минимально необходимые данные.</li><li>Связь аккаунта с кошельками — только после явного подтверждения пользователя.</li></ul><h2>Рекомендации интеграции</h2><p>Используй серверную проверку сессии и политики доступа в базе данных. Не доверяй user ID, полученному только из клиентского запроса. Не смешивай профиль QUN ID с приватными ключами кошелька.</p><div class="notice"><strong>Статус:</strong> единый ID описан как архитектурное направление; конкретные endpoints и стабильный публичный SDK необходимо сверить с текущим кодом перед интеграцией.</div>`},
sdk:{title:"SDK и API",group:"Разработка",keywords:"sdk api rest json endpoint клиент версии",html:`<div class="eyebrow">DEVELOPER REFERENCE</div><h1>SDK и API</h1><p class="lead">Единый стиль интеграции для сервисов QUN. Этот раздел задаёт соглашения; он не объявляет ещё не реализованные endpoints работающими.</p><h2>Рекомендуемые соглашения API</h2><ul><li>JSON для запросов и ответов.</li><li>Явная версия в пути или заголовке.</li><li>Постоянные идентификаторы запросов и идемпотентность операций записи.</li><li>Понятные коды ошибок без утечки секретов.</li><li>Серверная проверка авторизации и прав доступа.</li></ul><h2>Пример формы ответа</h2><div class="code"><button class="copy">Копировать</button><code>{
  "data": {
    "id": "example_id",
    "status": "ok"
  },
  "error": null,
  "request_id": "req_example"
}</code></div><h2>Планируемая структура SDK</h2><div class="code"><button class="copy">Копировать</button><code>qun-sdk/
  auth/
  id/
  wallet/
  payments/
  storage/
  node/
  errors/
  types/</code></div><p>До публикации стабильного SDK не устанавливай пакет с предполагаемым именем и не используй пример как рабочий endpoint. Сначала проверь актуальную спецификацию и репозиторий.</p>`},
payments:{title:"Платежи",group:"Разработка",keywords:"оплата платежи транзакции заказ TON Stars webhook",html:`<div class="eyebrow">PAYMENTS</div><h1>Платежи и транзакции</h1><p class="lead">Платёжная интеграция должна быть проверяемой, идемпотентной и независимой от клиентских уведомлений.</p><h2>Жизненный цикл заказа</h2><div class="steps"><div class="step"><div class="num">1</div><div><strong>Создать заказ на сервере</strong><span>Зафиксировать ID, сумму, валюту, получателя и срок действия.</span></div></div><div class="step"><div class="num">2</div><div><strong>Предложить способ оплаты</strong><span>Выбрать разрешённый для продукта и платформы метод: кошелёк, платёжный провайдер или Stars там, где это требуется правилами Telegram.</span></div></div><div class="step"><div class="num">3</div><div><strong>Проверить транзакцию независимо</strong><span>Проверить сеть, адрес, актив, сумму, получателя и уникальность транзакции на сервере.</span></div></div><div class="step"><div class="num">4</div><div><strong>Обновить заказ атомарно</strong><span>Повторные webhook или запросы не должны выдавать товар дважды.</span></div></div><div class="step"><div class="num">5</div><div><strong>Сохранить квитанцию</strong><span>Хранить историю статусов, идентификаторы транзакций и причины отказа.</span></div></div></div><h2>Безопасные правила</h2><ul><li>Нельзя доверять сообщению браузера «оплачено».</li><li>Секреты провайдера хранятся только в серверных secrets.</li><li>Webhook проверяется криптографически, если провайдер это поддерживает.</li><li>Учитываются подтверждения сети, повторы и реорганизации цепочки.</li><li>Покупки цифровых товаров внутри Telegram должны соответствовать актуальным правилам Stars.</li></ul><div class="notice"><strong>Статус:</strong> это спецификация целевого процесса. Перед включением реальных платежей требуется выбрать сети и провайдеров, реализовать серверную проверку и протестировать сценарии ошибок.</div>`},
connect:{title:"Кошельки и Connect",group:"Разработка",keywords:"ton connect wallet near hot multichain подпись",html:`<div class="eyebrow">WALLET CONNECTIVITY</div><h1>Кошельки и Connect</h1><p class="lead">Общий интерфейс для подключения кошельков без передачи приватных ключей приложениям.</p><h2>TON Connect</h2><p>TON Connect — стандарт взаимодействия приложений с совместимыми TON-кошельками. Он позволяет запросить подключение и подпись транзакции. Начни с официальной документации:</p><p><a href="https://docs.ton.org/applications/ton-connect/overview" target="_blank" rel="noreferrer">TON Connect overview ↗</a> · <a href="https://docs.ton.org/applications/ton-connect/web" target="_blank" rel="noreferrer">Web integration ↗</a></p><h2>Адаптерная модель QUN</h2><div class="code"><button class="copy">Копировать</button><code>WalletAdapter
  connect()       → public account
  disconnect()    → session closed
  signMessage()   → signed payload
  sendTransaction() → transaction reference</code></div><p>Это концептуальный интерфейс, не готовая библиотека. Каждый адаптер обязан соблюдать требования своей сети и явно показывать пользователю, что именно он подписывает.</p><h2>Правила безопасности</h2><ul><li>Не запрашивать и не сохранять seed-фразы.</li><li>Показывать сеть, получателя, актив и сумму до подписи.</li><li>Не считать подключение кошелька подтверждением личности без отдельного механизма проверки.</li><li>Проверять результат транзакции сервером.</li></ul>`},
node:{title:"QUN Node",group:"Инфраструктура",keywords:"узел агент компьютер телефон статус контроль сеть",html:`<div class="eyebrow">DISTRIBUTED INFRASTRUCTURE</div><h1>QUN Node</h1><p class="lead">Узел QUN — участник распределённой инфраструктуры. Цель направления: надёжное хранение объектов, обнаружение доступных узлов и восстановление после отключений.</p><h2>Что должен обеспечивать узел</h2><ul><li>Уникальный идентификатор и версию агента.</li><li>Регистрацию и heartbeat с контролем доступности.</li><li>Хранение объектов с SHA-256 и проверкой целостности.</li><li>Возобновление передачи после временного отключения.</li><li>Локальный журнал и понятный статус.</li><li>Обновление с проверкой происхождения и целостности пакета.</li></ul><h2>Проверки перед масштабированием</h2><div class="steps"><div class="step"><div class="num">1</div><div><strong>Повторить передачу PC ↔ Android</strong><span>Проверить хеш до и после передачи.</span></div></div><div class="step"><div class="num">2</div><div><strong>Проверить отключение узла</strong><span>Объект должен оставаться доступным при наличии достаточного числа реплик.</span></div></div><div class="step"><div class="num">3</div><div><strong>Проверить восстановление</strong><span>Повреждённая или потерянная реплика должна обнаруживаться и восстанавливаться.</span></div></div><div class="step"><div class="num">4</div><div><strong>Провести нагрузочные тесты</strong><span>Сначала синтетические нагрузки и ограниченные тесты, затем постепенное расширение.</span></div></div></div><p><a href="https://serega40in.github.io/QUN/node/">Открыть страницу QUN Node ↗</a></p>`},
storage:{title:"QUN Storage",group:"Инфраструктура",keywords:"хранилище файлы репликация резервное копирование хеш",html:`<div class="eyebrow">OBJECT STORAGE</div><h1>QUN Storage</h1><p class="lead">Целевой слой хранения объектов с адресацией по идентификатору, проверкой целостности и политикой репликации.</p><h2>Модель объекта</h2><div class="code"><button class="copy">Копировать</button><code>{
  "object_id": "content-address-or-uuid",
  "size_bytes": 0,
  "sha256": "…",
  "replica_policy": {
    "min_copies": 3
  }
}</code></div><p>Пример показывает концепцию метаданных, а не текущий API. Для production нужно определить криптографическую адресацию, шифрование, квоты, удаление, права доступа и политику размещения.</p><h2>Основные требования</h2><ul><li>Проверка контрольной суммы при записи и чтении.</li><li>Реплики на независимых узлах, а не несколько копий на одном диске.</li><li>Фоновая проверка целостности и автоматическое восстановление.</li><li>Защита от спама, ограничение размеров и квоты.</li><li>Шифрование приватных объектов и управление доступом.</li><li>Чёткая политика удаления и жизненного цикла данных.</li></ul>`},
sharding:{title:"Шардирование",group:"Инфраструктура",keywords:"sharding шарды распределение нагрузка база данных blockchain",html:`<div class="eyebrow">ARCHITECTURE ROADMAP</div><h1>Шардирование QUN</h1><p class="lead">Распределение данных и нагрузки между независимыми сегментами. Шардирование хранения и шардирование состояния блокчейна — разные задачи.</p><h2>Предлагаемый путь</h2><div class="steps"><div class="step"><div class="num">1</div><div><strong>Шардирование объектов хранения</strong><span>Определить устойчивый алгоритм размещения объектов между узлами и правила репликации.</span></div></div><div class="step"><div class="num">2</div><div><strong>Отказоустойчивость и перебалансировка</strong><span>Обнаруживать недоступные узлы, восстанавливать реплики и переносить данные без потери доступности.</span></div></div><div class="step"><div class="num">3</div><div><strong>Разделение нагрузки сервисов</strong><span>Разделить очереди, индексацию и обработку запросов там, где измерения показывают необходимость.</span></div></div><div class="step"><div class="num">4</div><div><strong>Исследование шардирования QUN Core</strong><span>Только после спецификации консенсуса, межшардовых транзакций, защиты от двойных расходов и формальной модели угроз.</span></div></div></div><div class="notice"><strong>Статус: roadmap.</strong> Шардирование не внедрено этой страницей. Это план архитектуры, который требует отдельной спецификации и тестов.</div>`},
core:{title:"QUN Core",group:"Инфраструктура",keywords:"blockchain консенсус виртуальная машина смарт контракты",html:`<div class="eyebrow">RESEARCH</div><h1>QUN Core</h1><p class="lead">Исследовательское направление для возможного собственного протокола и цифровой экономики QUN.</p><h2>До запуска собственной сети необходимо определить</h2><ul><li>Модель угроз и требования к консенсусу.</li><li>Тип валидаторов и экономические стимулы.</li><li>Модель состояния, транзакций и комиссий.</li><li>Совместимость со стандартами и кошельками.</li><li>Обновления протокола и управление изменениями.</li><li>Аудит, тестовая сеть и инструменты мониторинга.</li></ul><p>Не требуется создавать собственный язык программирования на первом этапе. Сначала определяются задачи, затем сравниваются существующие виртуальные машины и языки.</p><div class="notice"><strong>Статус: исследование.</strong> Не воспринимай QUN Core как готовый публичный блокчейн.</div>`},
ai:{title:"QUN AI",group:"Экосистема",keywords:"ии агент инструменты знания интеграция",html:`<div class="eyebrow">AI PLATFORM</div><h1>QUN AI</h1><p class="lead">ИИ-помощник для поиска по экосистеме, объяснения документации и помощи разработчикам.</p><h2>Целевые сценарии</h2><ul><li>Найти нужный сервис, метод API или инструкцию.</li><li>Объяснить архитектуру и показать пример интеграции.</li><li>Подготовить шаблон проекта по проверенной спецификации.</li><li>Помочь диагностировать ошибку по логам без раскрытия секретов.</li><li>В будущем — выполнять действия только с явным разрешением пользователя.</li></ul><h2>Требования к ответам</h2><p>ИИ должен отличать реализованные возможности от roadmap, ссылаться на актуальную документацию и не выдумывать endpoints, токены или подтверждения транзакций.</p>`},
studio:{title:"QUN Studio",group:"Экосистема",keywords:"studio шаблоны приложение cli playground создание",html:`<div class="eyebrow">BUILD TOOLS · ROADMAP</div><h1>QUN Studio</h1><p class="lead">Будущая рабочая среда для создания продуктов QUN: шаблоны, генератор проекта, проверка интеграций и интерактивные примеры.</p><h2>Предлагаемые инструменты</h2><ul><li>Генератор веб-приложений и Telegram Mini Apps.</li><li>Шаблоны авторизации через QUN ID.</li><li>Песочница API без реальных секретов и денежных операций.</li><li>Локальный CLI для запуска, тестирования и сборки.</li><li>Проверка доступности сервисов и соответствия версий SDK.</li></ul><div class="notice"><strong>Статус: roadmap.</strong> Эта страница описывает планируемые инструменты, а не работающую браузерную IDE.</div>`},
security:{title:"Безопасность",group:"Экосистема",keywords:"security безопасность ключи секреты rls аудит",html:`<div class="eyebrow">SECURITY</div><h1>Безопасность</h1><p class="lead">Безопасность проектируется как свойство всей системы: от интерфейса и API до узлов, кошельков и резервных копий.</p><h2>Минимальные правила</h2><ul><li>Никогда не публиковать приватные ключи, seed-фразы, пароли и service-role ключи.</li><li>Проверять права доступа на сервере и в политиках RLS.</li><li>Ограничивать частоту запросов и размеры загрузок.</li><li>Проверять подписи webhook и не доверять клиентским статусам.</li><li>Подписывать релизы и проверять целостность обновлений Node.</li><li>Вести журнал действий без записи секретов и лишних персональных данных.</li><li>Перед реальными платежами и запуском протокола проводить независимый аудит.</li></ul><h2>Сообщение об уязвимости</h2><p>Не публикуй рабочие секреты или детали эксплуатируемой уязвимости в открытых issue. Сначала подготовь минимальное описание проблемы и безопасный канал раскрытия.</p>`}
};
const main=document.getElementById('main'), search=document.getElementById('search'), results=document.getElementById('results');
function go(key,update=true){if(!pages[key])key='home';const p=pages[key];document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===key));main.innerHTML='<div class="crumb">QUN Developer / '+p.group+' / '+p.title+'</div><article class="content">'+p.html+'</article><div class="footer"><span>QUN Developer · Документация в развитии</span><span><a href="https://github.com/Serega40in/QUN">Исходный код ↗</a> · <a href="https://serega40in.github.io/QUN/">QUN Home ↗</a></span></div>';if(update)history.replaceState(null,'','#'+key);main.focus({preventScroll:true});document.getElementById('layout').classList.remove('aside-open');window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{const n=e.target.closest('[data-page],[data-go]');if(n){go(n.dataset.page||n.dataset.go);return}const c=e.target.closest('.copy');if(c){const text=c.parentElement.innerText.replace('Копировать','').trim();navigator.clipboard?.writeText(text).then(()=>{c.textContent='Скопировано';setTimeout(()=>c.textContent='Копировать',1200)}).catch(()=>{c.textContent='Выдели код'});}});
document.getElementById('menu').addEventListener('click',()=>document.getElementById('layout').classList.toggle('aside-open'));
function find(q){const s=q.trim().toLowerCase();if(!s){results.style.display='none';return}const found=Object.entries(pages).filter(([k,p])=>(p.title+' '+p.group+' '+p.keywords+' '+p.html.replace(/<[^>]*>/g,' ')).toLowerCase().includes(s)).slice(0,8);results.innerHTML=found.length?found.map(([k,p])=>'<a class="result" href="#'+k+'" data-go="'+k+'"><b>'+p.title+'</b><br><span style="color:#91a8bb;font-size:11px">'+p.group+' · '+p.keywords.split(' ').slice(0,5).join(' ')+'</span></a>').join(''):'<div class="empty">Ничего не найдено</div>';results.style.display='block'}
search.addEventListener('input',()=>find(search.value));search.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=results.querySelector('[data-go]');if(first)go(first.dataset.go)}if(e.key==='Escape')results.style.display='none'});document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))results.style.display='none'});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)||'home',false));go(location.hash.slice(1)||'home',false);
</script>
